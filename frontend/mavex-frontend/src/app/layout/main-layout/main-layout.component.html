<div class="mavex-layout" [class.sidebar-closed]="!layout.sidebarOpen()">
  <app-sidebar [class.sb-hidden]="!layout.sidebarOpen()" />

  <div class="mavex-main">
    <app-topbar />
    <div class="mavex-content">
      <router-outlet />
    </div>
  </div>
</div>

<!-- Toast notifications -->
<div class="toast-wrapper" aria-live="polite" aria-atomic="true">
  @for (t of toast.toasts(); track t.id) {
    <div
      class="mvx-toast"
      [class.mvx-toast--success]="t.type === 'success'"
      [class.mvx-toast--error]="t.type === 'error'"
      [class.mvx-toast--info]="t.type === 'info'"
      [class.mvx-toast--out]="t.dismissing"
      role="alert"
    >
      <!-- Icon -->
      <div class="mvx-toast__icon">
        @if (t.type === 'success') {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        } @else if (t.type === 'error') {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        }
      </div>

      <!-- Message -->
      <span class="mvx-toast__msg">{{ t.message }}</span>

      <!-- Close -->
      <button
        class="mvx-toast__close"
        type="button"
        (click)="toast.dismiss(t.id)"
        aria-label="Fermer"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>

      <!-- Progress bar -->
      <div class="mvx-toast__bar"></div>
    </div>
  }
</div>
