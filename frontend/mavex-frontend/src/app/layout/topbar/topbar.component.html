<header class="tb" role="banner">

  <button
    type="button"
    class="tb-menu-toggle"
    (click)="layout.toggleSidebar()"
    [attr.aria-label]="layout.sidebarOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
    [attr.aria-expanded]="layout.sidebarOpen()"
  >
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24" aria-hidden="true">
      <line x1="3" y1="6"  x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <span class="tb-title">{{ layout.title() }}</span>

  @if (layout.action(); as act) {
    @if (act.routerLink) {
      <a
        class="tb-action"
        [routerLink]="act.routerLink"
        [attr.aria-label]="act.label"
      >
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="16 16 12 12 8 16"/>
          <line x1="12" y1="12" x2="12" y2="21"/>
          <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
        </svg>
        {{ act.label }}
      </a>
    } @else {
      <button
        type="button"
        class="tb-action"
        (click)="act.onClick?.()"
        [attr.aria-label]="act.label"
      >
        {{ act.label }}
      </button>
    }
  }

</header>
